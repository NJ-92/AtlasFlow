function GeniePanel({ role }) {
  const [enabled, setEnabled] = useState(null);
  const [question, setQuestion] = useState("");
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);
  const [history, setHistory] = useState([]);
  const [showHistory, setShowHistory] = useState(false);

  useEffect(() => { api("/api/genie/config").then(r => setEnabled(r.enabled)).catch(() => setEnabled(false)); }, []);

  const ask = async (q) => {
    const question_ = q || question;
    if (!question_) return;
    setBusy(true); setResult(null);
    try { setResult(await api("/api/genie/ask", { method: "POST", body: JSON.stringify({ question: question_ }) })); }
    catch (e) { setResult({ success: false, error: e.message }); }
    finally { setBusy(false); }
  };

  const loadHistory = async () => { setHistory(await api("/api/genie/history")); setShowHistory(true); };

  const suggestions = [
    "Which tables have the most rows?",
    "Show me a summary of what's in the catalog",
    "Count rows by table",
  ];

  if (enabled === false) {
    return (
      <div>
        <div className="section-label">Genie — ask questions about your data in plain English</div>
        <p style={{ color: "var(--muted)", fontSize: 12.5 }}>
          Not configured. Set <code>ATLASFLOW_ANTHROPIC_API_KEY</code> in your <code>.env</code>
          (get one at <code>console.anthropic.com</code>) and restart to enable this tab.
          This is a real LLM integration — it only sees table/column names, not your actual
          data, and generated SQL should always be reviewed before trusting the result.
        </p>
      </div>
    );
  }

  return (
    <div>
      <div className="section-label" style={{ display: "flex", justifyContent: "space-between" }}>
        <span>Genie — ask questions about your data in plain English</span>
        <button className="new-btn" onClick={loadHistory}>history</button>
      </div>
      <div className="inline-form" style={{ marginBottom: 8 }}>
        <input style={{ flex: 1, minWidth: 320 }} placeholder="Ask your question about the catalog..."
               value={question} onChange={e => setQuestion(e.target.value)}
               onKeyDown={e => e.key === "Enter" && ask()} />
        <button className="btn primary" onClick={() => ask()} disabled={busy || role === "viewer"}>{busy ? "Thinking..." : "Ask"}</button>
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 18 }}>
        {suggestions.map(s => (
          <button key={s} className="btn" style={{ fontSize: 11.5 }} onClick={() => { setQuestion(s); ask(s); }}>✨ {s}</button>
        ))}
      </div>

      {result && (
        <div>
          {result.sql && (
            <React.Fragment>
              <div className="section-label">Generated SQL</div>
              <pre className="logs">{result.sql}</pre>
            </React.Fragment>
          )}
          {!result.success && <div className="err">{result.error}</div>}
          {result.success && (
            <React.Fragment>
              <div style={{ color: "var(--muted)", fontSize: 11.5, fontFamily: "IBM Plex Mono", margin: "10px 0 6px" }}>{result.row_count} row(s)</div>
              <table className="admin-table">
                <thead><tr>{result.columns.map(c => <th key={c}>{c}</th>)}</tr></thead>
                <tbody>
                  {result.rows.slice(0, 50).map((row, i) => (
                    <tr key={i}>{result.columns.map(c => <td key={c}>{String(row[c])}</td>)}</tr>
                  ))}
                </tbody>
              </table>
              <SimpleBarChart columns={result.columns} rows={result.rows} />
            </React.Fragment>
          )}
        </div>
      )}

      {showHistory && (
        <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && setShowHistory(false)}>
          <div className="modal" style={{ width: 520 }}>
            <h3>Genie history</h3>
            <table className="admin-table">
              <thead><tr><th>Question</th><th>Status</th><th>When</th></tr></thead>
              <tbody>
                {history.map(h => (
                  <tr key={h.id} style={{ cursor: "pointer" }} onClick={() => { setQuestion(h.question); setShowHistory(false); }}>
                    <td>{h.question}</td>
                    <td><span className={"badge " + (h.success ? "success" : "failed")}>{h.success ? "ok" : "error"}</span></td>
                    <td style={{ color: "var(--muted)" }}>{h.created_at.slice(0, 19).replace("T", " ")}</td>
                  </tr>
                ))}
                {history.length === 0 && <tr><td colSpan="3" style={{ color: "var(--muted)" }}>No questions asked yet</td></tr>}
              </tbody>
            </table>
            <div className="row"><button className="btn" onClick={() => setShowHistory(false)}>Close</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

function AlertsPanel({ role }) {
  const [alerts, setAlerts] = useState([]);
  const [showNew, setShowNew] = useState(false);
  const [historyFor, setHistoryFor] = useState(null);
  const [history, setHistory] = useState([]);
  const [form, setForm] = useState({ name: "", sql: "", value_column: "", operator: ">", threshold: "", schedule_cron: "", notify_webhook: "" });
  const [err, setErr] = useState("");

  const load = async () => setAlerts(await api("/api/alerts"));
  useEffect(() => { load(); }, []);

  const create = async () => {
    if (!form.name || !form.sql || !form.value_column || !form.threshold) { setErr("Fill in name, SQL, column, and threshold"); return; }
    try {
      await api("/api/alerts", { method: "POST", body: JSON.stringify({ ...form, schedule_cron: form.schedule_cron || null, notify_webhook: form.notify_webhook || null }) });
      setShowNew(false); setForm({ name: "", sql: "", value_column: "", operator: ">", threshold: "", schedule_cron: "", notify_webhook: "" });
      load();
    } catch (e) { setErr(e.message); }
  };

  const checkNow = async (id) => { await api(`/api/alerts/${id}/check`, { method: "POST" }); load(); };
  const togglePause = async (id) => { await api(`/api/alerts/${id}/pause`, { method: "POST" }); load(); };
  const remove = async (id) => { await api(`/api/alerts/${id}`, { method: "DELETE" }); load(); };
  const viewHistory = async (a) => { setHistoryFor(a); setHistory(await api(`/api/alerts/${a.id}/history`)); };

  return (
    <div>
      <div className="section-label" style={{ display: "flex", justifyContent: "space-between" }}>
        <span>Alerts — get notified when a query result crosses a threshold</span>
        {role !== "viewer" && <button className="new-btn" onClick={() => setShowNew(true)}>+ new</button>}
      </div>
      <table className="admin-table">
        <thead><tr><th>Name</th><th>Condition</th><th>Status</th><th>Last value</th><th>Last checked</th><th></th></tr></thead>
        <tbody>
          {alerts.map(a => (
            <tr key={a.id}>
              <td>{a.name}{a.is_paused ? " (paused)" : ""}</td>
              <td style={{ color: "var(--muted)" }}>{a.value_column} {a.operator} {a.threshold}</td>
              <td><span className={"badge " + (a.last_status === "triggered" ? "failed" : a.last_status === "ok" ? "success" : "pending")}>{a.last_status}</span></td>
              <td style={{ color: "var(--muted)" }}>{a.last_value ?? "—"}</td>
              <td style={{ color: "var(--muted)" }}>{a.last_checked_at?.slice(0, 19).replace("T", " ") || "never"}</td>
              <td style={{ whiteSpace: "nowrap" }}>
                {role !== "viewer" && <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => checkNow(a.id)}>check now</button>}
                <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => viewHistory(a)}>history</button>
                {role !== "viewer" && <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => togglePause(a.id)}>{a.is_paused ? "resume" : "pause"}</button>}
                {role === "admin" && <button className="btn danger" style={{ padding: "2px 8px" }} onClick={() => remove(a.id)}>delete</button>}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      {alerts.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No alerts yet</div>}

      {historyFor && (
        <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && setHistoryFor(null)}>
          <div className="modal" style={{ width: 460 }}>
            <h3>History — "{historyFor.name}"</h3>
            <table className="admin-table">
              <thead><tr><th>When</th><th>Status</th><th>Value</th></tr></thead>
              <tbody>
                {history.map(h => (
                  <tr key={h.id}>
                    <td style={{ color: "var(--muted)" }}>{h.checked_at.slice(0, 19).replace("T", " ")}</td>
                    <td><span className={"badge " + (h.status === "triggered" ? "failed" : h.status === "ok" ? "success" : "pending")}>{h.status}</span></td>
                    <td>{h.value ?? "—"}</td>
                  </tr>
                ))}
                {history.length === 0 && <tr><td colSpan="3" style={{ color: "var(--muted)" }}>No checks recorded yet</td></tr>}
              </tbody>
            </table>
            <div className="row"><button className="btn" onClick={() => setHistoryFor(null)}>Close</button></div>
          </div>
        </div>
      )}

      {showNew && (
        <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && setShowNew(false)}>
          <div className="modal">
            <h3>New alert</h3>
            <div className="field"><label>Name</label><input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} /></div>
            <div className="field"><label>SQL (result's first row is checked)</label>
              <textarea value={form.sql} onChange={e => setForm({ ...form, sql: e.target.value })} placeholder="SELECT COUNT(*) as failed_count FROM delta.`/data/curated` WHERE status = 'failed'" />
            </div>
            <div className="inline-form">
              <input placeholder="column to watch (e.g. failed_count)" value={form.value_column} onChange={e => setForm({ ...form, value_column: e.target.value })} />
              <select value={form.operator} onChange={e => setForm({ ...form, operator: e.target.value })}>
                <option value=">">&gt;</option><option value="<">&lt;</option>
                <option value=">=">&gt;=</option><option value="<=">&lt;=</option>
                <option value="==">==</option><option value="!=">!=</option>
              </select>
              <input placeholder="threshold" value={form.threshold} onChange={e => setForm({ ...form, threshold: e.target.value })} />
            </div>
            <div className="field"><label>Schedule (cron, optional — leave blank for manual "check now" only)</label>
              <input value={form.schedule_cron} onChange={e => setForm({ ...form, schedule_cron: e.target.value })} placeholder="*/15 * * * *" />
            </div>
            <div className="field"><label>Notify webhook (optional)</label>
              <input value={form.notify_webhook} onChange={e => setForm({ ...form, notify_webhook: e.target.value })} placeholder="https://..." />
            </div>
            {err && <div className="err">{err}</div>}
            <div className="row">
              <button className="btn" onClick={() => setShowNew(false)}>Cancel</button>
              <button className="btn primary" onClick={create}>Create alert</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function PythonPanel({ role }) {
  const [code, setCode] = useState(
    "# 'tables' is a dict of {table_name: path} for everything in the Data tab\n" +
    "from deltalake import DeltaTable\n" +
    "import pandas as pd\n\n" +
    "# example: list what's available, then load one\n" +
    "print('available tables:', list(tables.keys()))\n\n" +
    "# df = DeltaTable(tables['your_table_name']).to_pandas()\n" +
    "# print(df.describe())\n" +
    "# task_output = {'rows': len(df)}  # shows up below, and can be reused by workflow tasks"
  );
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);

  const run = async () => {
    setBusy(true); setResult(null);
    try {
      const res = await api("/api/python/run", { method: "POST", body: JSON.stringify({ code }) });
      setResult(res);
    } catch (e) { setResult({ success: false, logs: e.message, output: {} }); } finally { setBusy(false); }
  };

  return (
    <div>
      <div className="section-label">Python — quick analysis, in-process</div>
      <p style={{ color: "var(--muted)", fontSize: 12.5, marginTop: -4 }}>
        Runs immediately (not distributed) with pandas + deltalake preinstalled — good for
        exploring onboarded tables and quick analysis. For large-scale distributed
        processing, use a <code>spark_submit</code> task in a workflow instead.
      </p>
      <textarea value={code} onChange={e => setCode(e.target.value)} spellCheck="false" style={{ height: 220 }} />
      <div style={{ marginTop: 10 }}>
        <button className="btn primary" onClick={run} disabled={busy || role === "viewer"}>
          {busy ? "Running..." : "Run"}
        </button>
      </div>
      {result && (
        <div style={{ marginTop: 14 }}>
          <div className={"badge " + (result.success ? "success" : "failed")} style={{ marginBottom: 8 }}>
            {result.success ? "success" : "error"}
          </div>
          <pre className="logs">{result.logs?.trim() || "(no output)"}</pre>
          {result.output && Object.keys(result.output).length > 0 && (
            <pre className="logs" style={{ color: "var(--blue)" }}>{"task_output → " + JSON.stringify(result.output)}</pre>
          )}
        </div>
      )}
    </div>
  );

function DashboardsPanel({ role }) {
  const [dashboards, setDashboards] = useState([]);
  const [selected, setSelected] = useState(null);
  const [results, setResults] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [newName, setNewName] = useState("");
  const [tiles, setTiles] = useState([{ title: "", sql: "" }]);
  const [busy, setBusy] = useState(false);

  const load = async () => setDashboards(await api("/api/dashboards"));
  useEffect(() => { load(); }, []);

  const view = async (d) => {
    setSelected(d); setResults(null); setBusy(true);
    try { setResults(await api(`/api/dashboards/${d.id}/refresh`, { method: "POST" })); }
    finally { setBusy(false); }
  };

  const createDashboard = async () => {
    if (!newName || tiles.every(t => !t.sql)) return;
    await api("/api/dashboards", { method: "POST", body: JSON.stringify({ name: newName, tiles: tiles.filter(t => t.sql) }) });
    setShowNew(false); setNewName(""); setTiles([{ title: "", sql: "" }]);
    load();
  };

  return (
    <div>
      <div className="section-label" style={{ display: "flex", justifyContent: "space-between" }}>
        <span>Dashboards — save multiple SQL charts together</span>
        {role !== "viewer" && <button className="new-btn" onClick={() => setShowNew(true)}>+ new</button>}
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
        {dashboards.map(d => (
          <button key={d.id} className={"btn" + (selected?.id === d.id ? " primary" : "")} onClick={() => view(d)}>{d.name}</button>
        ))}
        {dashboards.length === 0 && <div className="empty-state">No dashboards yet</div>}
      </div>

      {busy && <p style={{ color: "var(--muted)", fontSize: 12.5 }}>Refreshing tiles...</p>}
      {results && results.tiles.map(tile => (
        <div key={tile.tile_id} className="dag-panel" style={{ marginBottom: 14 }}>
          <div style={{ fontWeight: 600, marginBottom: 8 }}>{tile.title}</div>
          {!tile.success && <div className="err">{tile.error}</div>}
          {tile.success && (
            <React.Fragment>
              <table className="admin-table">
                <thead><tr>{tile.columns.map(c => <th key={c}>{c}</th>)}</tr></thead>
                <tbody>
                  {tile.rows.slice(0, 10).map((row, i) => (
                    <tr key={i}>{tile.columns.map(c => <td key={c}>{String(row[c])}</td>)}</tr>
                  ))}
                </tbody>
              </table>
              {tile.chart_type === "bar" && <SimpleBarChart columns={tile.columns} rows={tile.rows} />}
            </React.Fragment>
          )}
        </div>
      ))}

      {showNew && (
        <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && setShowNew(false)}>
          <div className="modal">
            <h3>New dashboard</h3>
            <div className="field"><label>Name</label><input value={newName} onChange={e => setNewName(e.target.value)} /></div>
            {tiles.map((t, i) => (
              <div key={i} style={{ marginBottom: 10 }}>
                <input placeholder="tile title" value={t.title} style={{ marginBottom: 4, width: "100%" }}
                       onChange={e => setTiles(tiles.map((x, xi) => xi === i ? { ...x, title: e.target.value } : x))} />
                <textarea placeholder="SQL" value={t.sql} style={{ height: 70 }}
                          onChange={e => setTiles(tiles.map((x, xi) => xi === i ? { ...x, sql: e.target.value } : x))} />
              </div>
            ))}
            <button className="btn" onClick={() => setTiles([...tiles, { title: "", sql: "" }])}>+ add tile</button>
            <div className="row">
              <button className="btn" onClick={() => setShowNew(false)}>Cancel</button>
              <button className="btn primary" onClick={createDashboard}>Create</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ModelsPanel({ role }) {
  const [deployments, setDeployments] = useState([]);
  const [modelName, setModelName] = useState("");
  const [modelVersion, setModelVersion] = useState("latest");
  const [predictInput, setPredictInput] = useState('{"dataframe_records": [{}]}');
  const [predictOutput, setPredictOutput] = useState(null);
  const [predictingId, setPredictingId] = useState(null);
  const [err, setErr] = useState("");

  const load = async () => setDeployments(await api("/api/models/deployments"));
  useEffect(() => { load(); }, []);

  const deploy = async () => {
    if (!modelName) return;
    setErr("");
    try {
      await api("/api/models/deploy", { method: "POST", body: JSON.stringify({ model_name: modelName, model_version: modelVersion }) });
      setModelName(""); load();
    } catch (e) { setErr(e.message); }
  };
  const stop = async (id) => { await api(`/api/models/deployments/${id}`, { method: "DELETE" }); load(); };
  const predict = async (id) => {
    setPredictOutput(null);
    try { setPredictOutput(await api(`/api/models/${id}/predict`, { method: "POST", body: predictInput })); }
    catch (e) { setPredictOutput({ error: e.message }); }
  };

  return (
    <div>
      <div className="section-label">Models — serve an MLflow-registered model</div>
      <p style={{ color: "var(--muted)", fontSize: 12.5, marginTop: -4 }}>
        Deploys a model already registered in MLflow (see the ML tracking examples) as a
        live prediction endpoint. Single instance — no rolling updates or replicas.
      </p>
      {role !== "viewer" && (
        <div className="inline-form">
          <input placeholder="registered model name" value={modelName} onChange={e => setModelName(e.target.value)} />
          <input placeholder="version (or 'latest')" value={modelVersion} onChange={e => setModelVersion(e.target.value)} />
          <button className="btn primary" onClick={deploy}>Deploy</button>
        </div>
      )}
      {err && <div className="err">{err}</div>}
      <table className="admin-table">
        <thead><tr><th>Model</th><th>Version</th><th>Status</th><th></th></tr></thead>
        <tbody>
          {deployments.map(d => (
            <React.Fragment key={d.id}>
              <tr>
                <td>{d.model_name}</td>
                <td style={{ color: "var(--muted)" }}>{d.model_version}</td>
                <td><span className={"badge " + (d.status === "running" ? "success" : "failed")}>{d.status}</span></td>
                <td style={{ whiteSpace: "nowrap" }}>
                  <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => setPredictingId(predictingId === d.id ? null : d.id)}>test</button>
                  {role === "admin" && <button className="btn danger" style={{ padding: "2px 8px" }} onClick={() => stop(d.id)}>stop</button>}
                </td>
              </tr>
              {predictingId === d.id && (
                <tr><td colSpan="4">
                  <textarea value={predictInput} onChange={e => setPredictInput(e.target.value)} style={{ height: 70 }} />
                  <button className="btn primary" style={{ marginTop: 6 }} onClick={() => predict(d.id)}>Send</button>
                  {predictOutput && <pre className="logs">{JSON.stringify(predictOutput, null, 2)}</pre>}
                </td></tr>
              )}
            </React.Fragment>
          ))}
        </tbody>
      </table>
      {deployments.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No models deployed yet</div>}
    </div>
  );
}

function SqlPanel({ role }) {
  const [sql, setSql] = useState("SELECT region, SUM(total_sales) as total\nFROM delta.`/data/curated`\nGROUP BY region");
  const [result, setResult] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [history, setHistory] = useState([]);
  const [showHistory, setShowHistory] = useState(false);
  const [paramValues, setParamValues] = useState({});

  // auto-detect :paramName tokens in the query, the same way Databricks auto-creates a
  // widget for each named parameter used in a query
  const detectedParams = Array.from(new Set((sql.match(/(?<!:):([a-zA-Z_][a-zA-Z0-9_]*)/g) || []).map(p => p.slice(1))));

  const loadHistory = async () => setHistory(await api("/api/sql/history"));

  const run = async () => {
    setBusy(true); setErr(""); setResult(null);
    try {
      const res = await api("/api/sql/query", { method: "POST", body: JSON.stringify({ sql, limit: 200, params: paramValues }) });
      setResult(res);
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };

  return (
    <div>
      <div className="section-label" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span>SQL — query Delta tables in the lakehouse</span>
        <button className="new-btn" onClick={() => { setShowHistory(!showHistory); if (!showHistory) loadHistory(); }}>
          {showHistory ? "hide history" : "history"}
        </button>
      </div>
      <p style={{ color: "var(--muted)", fontSize: 12.5, marginTop: -4 }}>
        Runs via the real Spark cluster with Delta Lake enabled — the same engine backing the
        `sql` task type. Reference a table you onboarded in the Data tab by name, or a raw path
        like <code>delta.`/data/curated`</code>. Use <code>:paramName</code> in your query to
        get an input box for it below, automatically.
      </p>
      {showHistory && (
        <table className="admin-table" style={{ marginBottom: 14 }}>
          <thead><tr><th>When</th><th>User</th><th>Query</th><th></th></tr></thead>
          <tbody>
            {history.map(h => (
              <tr key={h.id}>
                <td style={{ color: "var(--muted)" }}>{h.timestamp?.slice(0, 19).replace("T", " ")}</td>
                <td>{h.username || "—"}</td>
                <td style={{ maxWidth: 280, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{h.sql}</td>
                <td><button className="btn" style={{ padding: "2px 8px" }} onClick={() => { setSql(h.sql); setShowHistory(false); }}>load</button></td>
              </tr>
            ))}
            {history.length === 0 && <tr><td colSpan="4" style={{ color: "var(--muted)" }}>No queries run yet</td></tr>}
          </tbody>
        </table>
      )}
      <textarea value={sql} onChange={e => setSql(e.target.value)} spellCheck="false" style={{ height: 120 }} />
      {detectedParams.length > 0 && (
        <div className="inline-form" style={{ marginTop: 10 }}>
          {detectedParams.map(p => (
            <div key={p} className="field" style={{ marginBottom: 0 }}>
              <label>{p}</label>
              <input value={paramValues[p] || ""} onChange={e => setParamValues({ ...paramValues, [p]: e.target.value })} style={{ width: 140 }} />
            </div>
          ))}
        </div>
      )}
      <div style={{ marginTop: 10 }}>
        <button className="btn primary" onClick={run} disabled={busy || role === "viewer"}>
          {busy ? "Running..." : "Run query"}
        </button>
      </div>
      {err && <div className="err" style={{ marginTop: 10 }}>{err}</div>}
      {result && (
        <div style={{ marginTop: 16, overflowX: "auto" }}>
          <div style={{ color: "var(--muted)", fontSize: 11.5, fontFamily: "IBM Plex Mono", marginBottom: 6 }}>
            {result.row_count} row{result.row_count === 1 ? "" : "s"}
          </div>
          <table className="admin-table">
            <thead><tr>{result.columns.map(c => <th key={c}>{c}</th>)}</tr></thead>
            <tbody>
              {result.rows.map((row, i) => (
                <tr key={i}>{result.columns.map(c => <td key={c}>{String(row[c])}</td>)}</tr>
              ))}
            </tbody>
          </table>
          <SimpleBarChart columns={result.columns} rows={result.rows} />
        </div>
      )}
    </div>
  );
}

function App({ user, onLogout }) {
  const [tab, setTab] = useState("workflows");
  const [workflows, setWorkflows] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [runs, setRuns] = useState([]);
  const [selectedRun, setSelectedRun] = useState(null);
  const [showModal, setShowModal] = useState(false);
  const pollRef = useRef(null);
  const canEdit = user && (user.role === "editor" || user.role === "admin");
  const canAdmin = user && user.role === "admin";

  const loadWorkflows = useCallback(async () => {
    const wfs = await api("/api/workflows");
    setWorkflows(wfs);
    if (!selectedId && wfs.length) setSelectedId(wfs[0].id);
  }, [selectedId]);

  const loadRuns = useCallback(async (wfId) => {
    if (!wfId) return;
    const rs = await api(`/api/workflows/${wfId}/runs`);
    setRuns(rs);
    setSelectedRun(prev => {
      if (!prev) return rs[0] || null;
      const updated = rs.find(r => r.id === prev.id);
      return updated || rs[0] || null;
    });
  }, []);

  useEffect(() => { loadWorkflows(); }, []);
  useEffect(() => { loadRuns(selectedId); }, [selectedId]);

  // poll for status updates while any run is active
  useEffect(() => {
    clearInterval(pollRef.current);
    pollRef.current = setInterval(() => {
      loadRuns(selectedId);
      loadWorkflows();
    }, 2000);
    return () => clearInterval(pollRef.current);
  }, [selectedId, loadRuns, loadWorkflows]);

  const selectedWf = workflows.find(w => w.id === selectedId);

  const trigger = async () => {
    await api(`/api/workflows/${selectedId}/trigger`, { method: "POST" });
    loadRuns(selectedId);
  };
  const togglePause = async () => {
    await api(`/api/workflows/${selectedId}/pause`, { method: "POST" });
    loadWorkflows();
  };
  const cloneWorkflow = async () => {
    const cloned = await api(`/api/workflows/${selectedId}/clone`, { method: "POST" });
    await loadWorkflows();
    setSelectedId(cloned.id);
  };
  const remove = async () => {
    if (!confirm(`Delete workflow "${selectedWf.name}"?`)) return;
    await api(`/api/workflows/${selectedId}`, { method: "DELETE" });
    setSelectedId(null);
    loadWorkflows();
  };

  const latestStatus = (wf) => {
    // best-effort: not fetched per-item to keep list light; sidebar shows pause state only
    return wf.is_paused ? "pending" : null;
  };

  return (
    <React.Fragment>
      <div className="topbar">
        <span className="logo">ATLAS<span className="dot">·</span>FLOW</span>
        <span className="sub">workflow orchestrator</span>
        <span className="user-chip">

            <button className={"nav-tab" + (tab === "volumes" ? " active" : "")} onClick={() => setTab("volumes")}>Volumes</button>
            <button className={"nav-tab" + (tab === "sql" ? " active" : "")} onClick={() => setTab("sql")}>SQL</button>
            <button className={"nav-tab" + (tab === "python" ? " active" : "")} onClick={() => setTab("python")}>Python</button>
            <button className={"nav-tab" + (tab === "dashboards" ? " active" : "")} onClick={() => setTab("dashboards")}>Dashboards</button>
            <button className={"nav-tab" + (tab === "features" ? " active" : "")} onClick={() => setTab("features")}>Feature Store</button>

            <button className={"nav-tab" + (tab === "pipelines" ? " active" : "")} onClick={() => setTab("pipelines")}>Pipelines</button>
            <button className={"nav-tab" + (tab === "policies" ? " active" : "")} onClick={() => setTab("policies")}>Policies</button>
            <button className={"nav-tab" + (tab === "ai-gateway" ? " active" : "")} onClick={() => setTab("ai-gateway")}>AI Gateway</button>
            <button className={"nav-tab" + (tab === "playground" ? " active" : "")} onClick={() => setTab("playground")}>Playground</button>
            <button className={"nav-tab" + (tab === "git" ? " active" : "")} onClick={() => setTab("git")}>Git</button>
            <button className={"nav-tab" + (tab === "tokens" ? " active" : "")} onClick={() => setTab("tokens")}>Tokens</button>
            <button className={"nav-tab" + (tab === "billing" ? " active" : "")} onClick={() => setTab("billing")}>Billing</button>
            <button className={"nav-tab" + (tab === "secrets" ? " active" : "")} onClick={() => setTab("secrets")}>Secrets</button>
            {canAdmin && <button className={"nav-tab" + (tab === "users" ? " active" : "")} onClick={() => setTab("users")}>Users</button>}
            {canAdmin && <button className={"nav-tab" + (tab === "audit" ? " active" : "")} onClick={() => setTab("audit")}>Audit</button>}
          </div>
          {tab === "workflows" && (
            <React.Fragment>
              <div className="sidebar-header">
                <span>Workflows</span>
                {canEdit && <button className="new-btn" onClick={() => setShowModal(true)}>+ new</button>}
              </div>
              {workflows.map(wf => (
                <div key={wf.id} className={"wf-item" + (wf.id === selectedId ? " active" : "")} onClick={() => setSelectedId(wf.id)}>
                  <div className="name">
                    <span className={"status-dot" + (wf.last_run_status ? " " + wf.last_run_status : "")}></span>
                    {wf.name}
                  </div>
                  <div className="meta">
                    {wf.schedule_cron || "manual only"}{wf.is_paused ? " · paused" : ""}
                    {wf.next_run_at && !wf.is_paused ? ` · next: ${wf.next_run_at.slice(0, 16).replace("T", " ")}` : ""}
                  </div>
                </div>
              ))}
              {workflows.length === 0 && <div className="empty-state">No workflows yet</div>}
            </React.Fragment>
          )}
        </div>

        <div className="main">
          {tab === "data" && <DataPanel role={user?.role} />}
          {tab === "volumes" && <VolumesPanel role={user?.role} />}
          {tab === "sql" && <SqlPanel role={user?.role} />}
          {tab === "python" && <PythonPanel role={user?.role} />}
          {tab === "dashboards" && <DashboardsPanel role={user?.role} />}
          {tab === "features" && <FeatureStorePanel />}
          {tab === "models" && <ModelsPanel role={user?.role} />}
          {tab === "cluster" && <ClusterPanel />}
          {tab === "alerts" && <AlertsPanel role={user?.role} />}
          {tab === "genie" && <GeniePanel role={user?.role} />}
          {tab === "notebooks" && <NotebooksPanel role={user?.role} />}
          {tab === "ingestion" && <IngestionPanel role={user?.role} />}
          {tab === "lakebase" && <LakebasePanel role={user?.role} />}
          {tab === "sharing" && <SharingPanel role={user?.role} />}
          {tab === "pipelines" && <PipelinesPanel role={user?.role} />}
          {tab === "policies" && <PoliciesPanel role={user?.role} />}
          {tab === "ai-gateway" && <AIGatewayPanel role={user?.role} />}
          {tab === "playground" && <PlaygroundPanel role={user?.role} />}
          {tab === "git" && <GitReposPanel role={user?.role} />}
          {tab === "tokens" && <TokensPanel />}
          {tab === "billing" && <BillingPanel role={user?.role} />}
          {tab === "secrets" && <SecretsPanel role={user?.role} />}
          {tab === "users" && canAdmin && <UsersPanel />}
          {tab === "audit" && canAdmin && <AuditPanel />}

          {tab === "workflows" && !selectedWf && <div className="empty-state">Select or create a workflow to get started</div>}
          {tab === "workflows" && selectedWf && (
            <React.Fragment>
              <div className="breadcrumb">
                <a onClick={() => setSelectedId(null)}>Workflows</a>
                <span className="sep">/</span>
                <span className="current">{selectedWf.name}</span>
              </div>
              <div className="wf-title-row">
                <div>
                  <div className="wf-title">{selectedWf.name}</div>
                  <div className="wf-desc">{selectedWf.description}</div>
                </div>
                {canEdit && (
                  <div className="actions">
                    <button className="btn primary" onClick={trigger}>Run now</button>
                    <button className="btn" onClick={togglePause}>{selectedWf.is_paused ? "Resume" : "Pause"}</button>
                    <button className="btn" onClick={cloneWorkflow}>Clone</button>
                    {canAdmin && <button className="btn danger" onClick={remove}>Delete</button>}
                  </div>
                )}
              </div>

              <div className="section-label">DAG</div>
              <div className="dag-panel">
                <DagGraph tasks={selectedWf.tasks} run={selectedRun} />
              </div>

              <div className="section-label">Run history</div>
              <div className="runs-list">
                {runs.map(r => (
                  <div key={r.id} className={"run-row" + (selectedRun && selectedRun.id === r.id ? " selected" : "")} onClick={() => setSelectedRun(r)}>
                    <span className={"badge " + r.status}>{r.status}</span>
                    <span style={{ fontFamily: "IBM Plex Mono", color: "var(--muted)" }}>{r.triggered_by}</span>
                    {r.estimated_cost_usd > 0 && <span style={{ fontFamily: "IBM Plex Mono", color: "var(--muted)" }}>${r.estimated_cost_usd}</span>}
                    <span style={{ marginLeft: "auto", color: "var(--muted)", fontFamily: "IBM Plex Mono" }}>{r.started_at?.replace("T", " ").slice(0, 19)}</span>
                  </div>
                ))}
                {runs.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No runs yet{canEdit ? ' — click "Run now"' : ""}</div>}
              </div>

              {selectedRun && (
                <div className="run-detail">
                  <div className="section-label">Task runs — {selectedRun.id.slice(0, 8)}</div>
                  {selectedRun.task_runs.map(tr => (
                    <div key={tr.id}>
                      <div className={"task-row " + tr.status}>
                        <span className={"badge " + tr.status}>{tr.status}</span>
                        <span>{tr.task_key}</span>
                        <span style={{ color: "var(--muted)" }}>attempt {tr.attempt || 1}</span>
                      </div>
                      {tr.logs && <pre className="logs">{tr.logs.trim()}</pre>}
                      {tr.output && Object.keys(tr.output).length > 0 && (
                        <pre className="logs" style={{ color: "var(--blue)" }}>{"output → " + JSON.stringify(tr.output)}</pre>
                      )}
                    </div>
                  ))}
                  <RunComments runId={selectedRun.id} />
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      </div>
      {showModal && <NewWorkflowModal onClose={() => setShowModal(false)} onCreated={() => { setShowModal(false); loadWorkflows(); }} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Shell />);
</script>
</body>
</html>
