<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AtlasFlow — Workflow Orchestrator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  :root {
    --bg: #12151A;
    --panel: #1A1F27;
    --panel-hi: #21272F;
    --border: #2A3038;
    --text: #D8DEE6;
    --muted: #7C8794;
    --amber: #E8A33D;
    --green: #4FB286;
    --red: #E8604C;
    --blue: #5B9FE8;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  #root { height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    height: 56px; display: flex; align-items: center; padding: 0 20px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .topbar .logo { font-family: var(--mono); font-weight: 600; font-size: 15px; letter-spacing: 0.5px; }
  .topbar .logo .dot { color: var(--amber); }
  .topbar .sub { margin-left: 12px; color: var(--muted); font-size: 12px; font-family: var(--mono); }

  .layout { flex: 1; display: flex; overflow: hidden; }

  .sidebar {
    width: 280px; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0;
    padding: 14px 10px;
  }
  .sidebar-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 8px 12px; color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; font-family: var(--mono);
  }
  .new-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer; font-family: var(--mono);
  }
  .new-btn:hover { border-color: var(--blue); color: var(--blue); }

  .wf-item {
    padding: 10px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .wf-item:hover { background: var(--panel); }
  .wf-item.active { background: var(--panel-hi); border-color: var(--border); }
  .wf-item .name { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .wf-item .meta { font-size: 11px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .status-dot.success { background: var(--green); }
  .status-dot.failed, .status-dot.upstream_failed { background: var(--red); }
  .status-dot.running { background: var(--amber); animation: pulse 1.2s infinite; }
  .status-dot.skipped { background: var(--muted); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .main { flex: 1; overflow-y: auto; padding: 24px 28px; }
  .empty-state { color: var(--muted); font-family: var(--mono); font-size: 13px; margin-top: 40px; text-align: center; }

  .wf-title-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .wf-title { font-size: 20px; font-weight: 700; }
  .wf-desc { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .actions { display: flex; gap: 8px; }
  .btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 6px 14px; border-radius: 5px; font-size: 12.5px; cursor: pointer; font-family: var(--sans); font-weight: 600;
  }
  .btn:hover { border-color: var(--blue); }
  .btn.primary { background: var(--amber); color: #14171C; border-color: var(--amber); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }

  .section-label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 22px 0 10px; }

  .dag-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; }

  .runs-list { display: flex; flex-direction: column; gap: 6px; }
  .run-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 12.5px;
  }
  .run-row:hover { border-color: var(--blue); }
  .run-row.selected { border-color: var(--blue); background: var(--panel-hi); }
  .badge {
    font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .badge.success { background: rgba(79,178,134,0.15); color: var(--green); }
  .badge.failed, .badge.upstream_failed { background: rgba(232,96,76,0.15); color: var(--red); }
  .badge.running { background: rgba(232,163,61,0.15); color: var(--amber); }
  .badge.pending { background: rgba(124,135,148,0.15); color: var(--muted); }
  .badge.skipped { background: rgba(124,135,148,0.25); color: var(--text); }

  .run-detail { margin-top: 14px; }
  .task-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-left: 2px solid var(--border);
    margin-left: 4px; font-size: 12.5px; font-family: var(--mono);
  }
  .task-row.success { border-left-color: var(--green); }
  .task-row.failed, .task-row.upstream_failed { border-left-color: var(--red); }
  .task-row.running { border-left-color: var(--amber); }
  .task-row.skipped { border-left-color: var(--muted); opacity: 0.75; }

  pre.logs {
    background: #0E1116; border: 1px solid var(--border); border-radius: 6px; padding: 12px;
    font-family: var(--mono); font-size: 11.5px; color: var(--muted); max-height: 280px; overflow: auto;
    white-space: pre-wrap; margin-top: 8px;
  }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .modal {
    width: 640px; max-height: 80vh; overflow-y: auto; background: var(--panel-hi); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px;
  }
  .modal h3 { margin-top: 0; }
  textarea {
    width: 100%; height: 320px; background: #0E1116; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; font-family: var(--mono); font-size: 12px; padding: 10px; resize: vertical;
  }
  .modal .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .err { color: var(--red); font-size: 12px; margin-top: 8px; font-family: var(--mono); }

  .login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { width: 340px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 28px; }
  .login-card .logo { font-family: var(--mono); font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .login-card .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; font-family: var(--mono); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }
  .field input {
    width: 100%; background: #0E1116; border: 1px solid var(--border); color: var(--text);
    border-radius: 5px; padding: 8px 10px; font-size: 13px; font-family: var(--sans);
  }
  .field input:focus { outline: none; border-color: var(--blue); }

  .nav-tabs { display: flex; flex-direction: column; gap: 1px; padding: 0 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .nav-tab {
    background: transparent; border: none; border-left: 2px solid transparent; color: var(--muted);
    font-size: 12px; font-family: var(--mono); padding: 7px 10px; text-align: left; cursor: pointer;
    display: block; width: 100%; border-radius: 0 4px 4px 0;
  }
  .nav-tab:hover { color: var(--text); background: var(--panel); }
  .nav-tab.active { background: var(--panel-hi); color: var(--text); border-left-color: var(--amber); font-weight: 600; }

  .breadcrumb { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .breadcrumb a { color: var(--blue); cursor: pointer; }
  .breadcrumb .sep { margin: 0 6px; color: var(--border); }
  .breadcrumb .current { color: var(--text); }

  .user-chip {
    display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 12px; font-family: var(--mono); color: var(--muted);
  }
  .role-pill {
    padding: 1px 7px; border-radius: 10px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    background: rgba(91,159,232,0.15); color: var(--blue);
  }
  .logout-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-family: var(--mono); font-size: 11px; text-decoration: underline; }

  table.admin-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.admin-table th { text-align: left; color: var(--muted); font-family: var(--mono); font-size: 11px; text-transform: uppercase; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  table.admin-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); font-family: var(--mono); }
  .inline-form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .inline-form input, .inline-form select {
    background: #0E1116; border: 1px solid var(--border); color: var(--text); border-radius: 5px;
    padding: 6px 10px; font-size: 12.5px; font-family: var(--sans);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const API_BASE = window.API_BASE || "http://localhost:8000";

function getToken() { return localStorage.getItem("atlasflow_token"); }
function setSession(token, username, role) {
  if (token) {
    localStorage.setItem("atlasflow_token", token);
    localStorage.setItem("atlasflow_user", JSON.stringify({ username, role }));
  } else {
    localStorage.removeItem("atlasflow_token");
    localStorage.removeItem("atlasflow_user");
  }
}
function getSessionUser() {
  try { return JSON.parse(localStorage.getItem("atlasflow_user")); } catch { return null; }
}

async function api(path, opts = {}) {
  const token = getToken();
  const res = await fetch(API_BASE + path, {
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: "Bearer " + token } : {}),
    },
    ...opts,
  });
  if (res.status === 401) {
    setSession(null);
    window.location.reload();
    throw new Error("Session expired");
  }
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
}

async function apiUpload(path, formData) {
  const token = getToken();
  const res = await fetch(API_BASE + path, {
    method: "POST",
    headers: { ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: formData,
  });
  if (res.status === 401) { setSession(null); window.location.reload(); throw new Error("Session expired"); }
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
}

const EXAMPLE_WORKFLOW = {
  name: "daily_sales_etl",
  description: "Extract, transform, validate, and conditionally notify - demonstrates task values and run_if",
  schedule_cron: "0 2 * * *",
  on_failure_webhook: null,
  tasks: [
    { key: "extract", type: "shell", command: "echo 'pulling raw files into /data/raw'\necho \"ATLASFLOW_OUTPUT_JSON:{\\\"row_count\\\": 4213}\"", depends_on: [], params: {}, retries: 0, timeout_seconds: 600 },
    { key: "transform_spark", type: "spark_submit", command: "/jobs/transform_sales.py", depends_on: ["extract"], params: { args: ["--input", "/data/raw", "--output", "/data/curated"] }, retries: 1, timeout_seconds: 3600 },
    { key: "quality_check", type: "sql", command: "SELECT region, SUM(total_sales) as total FROM delta.`/data/curated` GROUP BY region", depends_on: ["transform_spark"], params: { limit: 50 }, retries: 0, timeout_seconds: 300 },
    { key: "notify", type: "shell", command: "echo 'pipeline complete, row_count was' $ATLASFLOW_UPSTREAM_JSON", depends_on: ["quality_check"], run_if: "upstream['extract']['row_count'] > 0", params: {}, retries: 0, timeout_seconds: 60 },
  ],
};

// --- layered layout for DAG rendering (mirrors the backend's topological_layers) ---
function computeLayers(tasks) {
  const byKey = Object.fromEntries(tasks.map(t => [t.key, t]));
  const indeg = Object.fromEntries(tasks.map(t => [t.key, (t.depends_on || []).length]));
  const dependents = {};
  tasks.forEach(t => (t.depends_on || []).forEach(d => {
    dependents[d] = dependents[d] || [];
    dependents[d].push(t.key);
  }));
  let frontier = tasks.filter(t => indeg[t.key] === 0).map(t => t.key);
  const layers = [];
  const remaining = { ...indeg };
  while (frontier.length) {
    layers.push(frontier.map(k => byKey[k]));
    const next = [];
    frontier.forEach(k => (dependents[k] || []).forEach(dk => {
      remaining[dk] -= 1;
      if (remaining[dk] === 0) next.push(dk);
    }));
    frontier = next;
  }
  return layers;
}

function statusOf(taskKey, run) {
  if (!run) return "pending";
  const tr = (run.task_runs || []).find(t => t.task_key === taskKey);
  return tr ? tr.status : "pending";
}

function DagGraph({ tasks, run }) {
  const layers = computeLayers(tasks);
  const colWidth = 190, rowHeight = 64, nodeW = 158, nodeH = 40;
  const positions = {};
  layers.forEach((layer, ci) => {
    layer.forEach((t, ri) => {
      positions[t.key] = { x: ci * colWidth + 20, y: ri * rowHeight + 20 };
    });
  });
  const width = layers.length * colWidth + 20;
  const height = Math.max(...layers.map(l => l.length)) * rowHeight + 20;
  const colorFor = s => ({ success: "var(--green)", failed: "var(--red)", upstream_failed: "var(--red)", running: "var(--amber)", skipped: "var(--muted)", pending: "var(--border)" }[s] || "var(--border)");

  return (
    <svg width={width} height={height} style={{ minWidth: "100%" }}>
      {tasks.map(t => (t.depends_on || []).map(dep => {
        const from = positions[dep], to = positions[t.key];
        if (!from || !to) return null;
        const x1 = from.x + nodeW, y1 = from.y + nodeH / 2;
        const x2 = to.x, y2 = to.y + nodeH / 2;
        const mid = (x1 + x2) / 2;
        const active = statusOf(t.key, run) === "running" || statusOf(dep, run) === "running";
        return (
          <path key={dep + "->" + t.key}
            d={`M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`}
            stroke={active ? "var(--amber)" : "var(--border)"} strokeWidth="1.5" fill="none"
            strokeDasharray={active ? "5,4" : "none"}>
            {active && <animate attributeName="stroke-dashoffset" from="18" to="0" dur="0.6s" repeatCount="indefinite" />}
          </path>
        );
      }))}
      {tasks.map(t => {
        const p = positions[t.key];
        if (!p) return null;
        const status = statusOf(t.key, run);
        return (
          <g key={t.key} transform={`translate(${p.x},${p.y})`}>
            <rect width={nodeW} height={nodeH} rx="6" fill="var(--panel-hi)" stroke={colorFor(status)} strokeWidth="1.5" />
            <circle cx="14" cy={nodeH/2} r="4" fill={colorFor(status)} />
            <text x="26" y={nodeH/2 - 3} fill="var(--text)" fontSize="12" fontFamily="IBM Plex Mono" fontWeight="600">{t.key}</text>
            <text x="26" y={nodeH/2 + 12} fill="var(--muted)" fontSize="10" fontFamily="IBM Plex Mono">{t.type}</text>
          </g>
        );
      })}
    </svg>
  );
}

function NewWorkflowModal({ onClose, onCreated }) {
  const [text, setText] = useState(JSON.stringify(EXAMPLE_WORKFLOW, null, 2));
  const [err, setErr] = useState("");
  const submit = async () => {
    try {
      const payload = JSON.parse(text);
      await api("/api/workflows", { method: "POST", body: JSON.stringify(payload) });
      onCreated();
    } catch (e) { setErr(e.message); }
  };
  return (
    <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h3>New workflow</h3>
        <p style={{ color: "var(--muted)", fontSize: 12.5, marginTop: -6 }}>
          Define a DAG as JSON: tasks reference each other by <code>key</code> in <code>depends_on</code>.
          Task <code>type</code> is one of python / shell / spark_submit / sql / notebook.
          Reference secrets as <code>{"{{secret:name}}"}</code> and upstream task values as
          <code> {"{{task.key.field}}"}</code>. Add <code>run_if</code> (a Python expression, e.g.
          <code> "upstream['extract']['row_count'] &gt; 0"</code>) to skip a task conditionally.
          Set <code>on_failure_webhook</code> to a URL to get a POSTed JSON summary if a run fails.
          For <code>sql</code> tasks, bind named <code>:paramName</code> tokens via
          <code> params: {"{sql_params: {paramName: \"value\"}}"}</code>. Set
          <code> cluster_policy_name</code> to attach a governed policy (see the Policies tab).
        </p>
        <textarea value={text} onChange={e => setText(e.target.value)} spellCheck="false" />
        {err && <div className="err">{err}</div>}
        <div className="row">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn primary" onClick={submit}>Create workflow</button>
        </div>
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [oidcEnabled, setOidcEnabled] = useState(false);
  const [samlEnabled, setSamlEnabled] = useState(false);

  useEffect(() => {
    api("/api/auth/sso/config").then(r => { setOidcEnabled(r.oidc_enabled); setSamlEnabled(r.saml_enabled); }).catch(() => {});
    // handle a redirect back from an SSO callback: /?sso_token=...&username=...&role=...
    const params = new URLSearchParams(window.location.search);
    const ssoToken = params.get("sso_token");
    const ssoError = params.get("sso_error");
    if (ssoToken) {
      setSession(ssoToken, params.get("username"), params.get("role"));
      window.history.replaceState({}, "", window.location.pathname);
      onLogin();
    } else if (ssoError) {
      setErr("SSO login failed: " + ssoError);
      window.history.replaceState({}, "", window.location.pathname);
    }
  }, []);

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true); setErr("");
    try {
      const res = await fetch(API_BASE + "/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      if (!res.ok) throw new Error((await res.json()).detail || "Login failed");
      const data = await res.json();
      setSession(data.access_token, data.username, data.role);
      onLogin();
    } catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  };

  return (
    <div className="login-screen">
      <form className="login-card" onSubmit={submit}>
        <div className="logo">ATLAS<span style={{ color: "var(--amber)" }}>·</span>FLOW</div>
        <div className="sub">sign in to continue</div>
        {(oidcEnabled || samlEnabled) && (
          <React.Fragment>
            {oidcEnabled && (
              <button type="button" className="btn" style={{ width: "100%", marginBottom: 8 }}
                      onClick={() => window.location.href = API_BASE + "/api/auth/sso/login"}>
                Sign in with SSO (OIDC)
              </button>
            )}
            {samlEnabled && (
              <button type="button" className="btn" style={{ width: "100%", marginBottom: 8 }}
                      onClick={() => window.location.href = API_BASE + "/api/auth/saml/login"}>
                Sign in with SSO (SAML)
              </button>
            )}
            <div style={{ textAlign: "center", color: "var(--muted)", fontSize: 11, marginBottom: 14, fontFamily: "IBM Plex Mono" }}>or use a local account</div>
          </React.Fragment>
        )}
        <div className="field">
          <label>Username</label>
          <input value={username} onChange={e => setUsername(e.target.value)} autoFocus />
        </div>
        <div className="field">
          <label>Password</label>
          <input type="password" value={password} onChange={e => setPassword(e.target.value)} />
        </div>
        {err && <div className="err">{err}</div>}
        <button className="btn primary" style={{ width: "100%", marginTop: 6 }} disabled={busy}>
          {busy ? "Signing in..." : "Sign in"}
        </button>
        <div style={{ color: "var(--muted)", fontSize: 11, marginTop: 14, fontFamily: "IBM Plex Mono" }}>
          First run? Default admin is <code>admin</code> / the password set via
          <code> ATLASFLOW_ADMIN_BOOTSTRAP_PASSWORD</code> (default <code>atlasflow-admin</code>).
          Change it immediately after signing in.
        </div>
      </form>
    </div>
  );
}

function SecretsPanel({ role }) {
  const [secrets, setSecrets] = useState([]);
  const [name, setName] = useState("");
  const [value, setValue] = useState("");
  const load = async () => setSecrets(await api("/api/secrets"));
  useEffect(() => { load(); }, []);
  const create = async () => {
    if (!name || !value) return;
    await api("/api/secrets", { method: "POST", body: JSON.stringify({ name, value }) });
    setName(""); setValue(""); load();
  };
  const remove = async (id) => { await api(`/api/secrets/${id}`, { method: "DELETE" }); load(); };
  return (
    <div>
      <div className="section-label">Secrets — reference in tasks as {"{{secret:name}}"}</div>
      {role !== "viewer" && (
        <div className="inline-form">
          <input placeholder="name (e.g. snowflake_password)" value={name} onChange={e => setName(e.target.value)} />
          <input placeholder="value" type="password" value={value} onChange={e => setValue(e.target.value)} />
          <button className="btn primary" onClick={create}>Add / update</button>
        </div>
      )}
      <table className="admin-table">

function SimpleBarChart({ columns, rows }) {
  // auto-charts the common "one label column + one numeric column" shape (e.g. group-by results)
  const numericCol = columns.find(c => rows.every(r => !isNaN(parseFloat(r[c])) && r[c] !== null));
  const labelCol = columns.find(c => c !== numericCol);
  if (!numericCol || !labelCol || rows.length === 0 || rows.length > 25) return null;

  const values = rows.map(r => parseFloat(r[numericCol]) || 0);
  const max = Math.max(...values, 1);
  const barH = 22, gap = 8, chartW = 480;

  return (
    <div style={{ marginTop: 18 }}>
      <div className="section-label" style={{ marginTop: 0 }}>Auto-chart — {numericCol} by {labelCol}</div>
      <svg width="100%" viewBox={`0 0 ${chartW + 140} ${rows.length * (barH + gap)}`}>
        {rows.map((r, i) => {
          const val = parseFloat(r[numericCol]) || 0;
          const w = (val / max) * chartW;
          const y = i * (barH + gap);
          return (
            <g key={i}>
              <text x="0" y={y + barH / 2} dominant-baseline="central" fontSize="11" fontFamily="IBM Plex Mono" fill="var(--muted)">
                {String(r[labelCol]).slice(0, 16)}
              </text>
              <rect x="130" y={y} width={Math.max(w, 2)} height={barH} rx="3" fill="var(--blue)" opacity="0.75" />
              <text x={130 + w + 8} y={y + barH / 2} dominant-baseline="central" fontSize="11" fontFamily="IBM Plex Mono" fill="var(--text)">
                {val.toLocaleString()}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

  const upload = async () => {
    if (!file || !name) { setErr("Pick a file and give the table a name"); return; }
    setBusy(true); setErr("");
    try {
      const fd = new FormData();
      fd.append("file", file);
      fd.append("name", name);
      fd.append("description", description);
      fd.append("file_format", format);
      fd.append("visibility", visibility);
      fd.append("is_feature_table", isFeatureTable);

      setFile(null); setName(""); setDescription(""); setIsFeatureTable(false); setEntityKey("");
      load();
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };

  const remove = async (id) => { await api(`/api/tables/${id}`, { method: "DELETE" }); load(); };
  const toggleVisibility = async (t) => {
    const next = t.visibility === "public" ? "restricted" : "public";
    await api(`/api/tables/${t.id}/visibility?visibility=${next}`, { method: "POST" });
    load();

    <div>
      <div className="section-label">Data — onboard a file as a queryable table</div>

        registered under the name you give it — after that, reference it by name in the
        SQL or Python tabs instead of a raw storage path. Mark it <b>restricted</b> to
        control who can read it, or as a <b>feature table</b> to make it available in the
        Feature Store tab.

        <div className="inline-form">
          <input type="file" onChange={e => setFile(e.target.files[0])} />
          <input placeholder="table name" value={name} onChange={e => setName(e.target.value)} />
          <input placeholder="description (optional)" value={description} onChange={e => setDescription(e.target.value)} />
          <select value={format} onChange={e => setFormat(e.target.value)}>
            <option value="csv">CSV</option>
            <option value="json">JSON</option>
            <option value="parquet">Parquet</option>
          </select>
          <select value={visibility} onChange={e => setVisibility(e.target.value)}>
            <option value="public">Public</option>
            <option value="restricted">Restricted</option>
          </select>
          <label style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12.5, color: "var(--muted)" }}>
            <input type="checkbox" checked={isFeatureTable} onChange={e => setIsFeatureTable(e.target.checked)} /> feature table
          </label>
          {isFeatureTable && <input placeholder="entity key column (e.g. customer_id)" value={entityKey} onChange={e => setEntityKey(e.target.value)} />}
          <button className="btn primary" onClick={upload} disabled={busy}>{busy ? "Onboarding..." : "Upload & onboard"}</button>
        </div>
      )}
      {err && <div className="err">{err}</div>}
      <table className="admin-table">
        <thead><tr><th>Name</th><th>Rows</th><th>Visibility</th><th>Description</th><th></th></tr></thead>
        <tbody>
          {tables.map(t => (
            <tr key={t.id}>
              <td>{t.name}{t.is_feature_table && <span className="role-pill" style={{ marginLeft: 6 }}>feature</span>}</td>
              <td style={{ color: "var(--muted)" }}>{t.row_count ?? "—"}</td>
              <td>
                {role !== "viewer" ? (
                  <button className="btn" style={{ padding: "2px 8px" }} onClick={() => toggleVisibility(t)}>{t.visibility}</button>
                ) : t.visibility}
              </td>
              <td style={{ color: "var(--muted)" }}>{t.description || "—"}</td>
              <td style={{ whiteSpace: "nowrap" }}>
                <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => setLineageModalTable(t)}>lineage</button>
                {role === "admin" && <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => setSecurityModalTable(t)}>security</button>}
                {t.visibility === "restricted" && role !== "viewer" && (
                  <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => setAccessModalTable(t)}>access</button>
                )}
                {role === "admin" && <button className="btn danger" style={{ padding: "2px 8px" }} onClick={() => remove(t.id)}>delete</button>}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      {tables.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No tables onboarded yet</div>}
      {accessModalTable && <TableAccessModal table={accessModalTable} onClose={() => setAccessModalTable(null)} />}
      {lineageModalTable && <LineageModal table={lineageModalTable} onClose={() => setLineageModalTable(null)} />}
      {securityModalTable && <SecurityModal table={securityModalTable} onClose={() => setSecurityModalTable(null)} />}
    </div>
  );
}

      await api("/api/volumes", { method: "POST", body: JSON.stringify({ name: newVolName, visibility: newVolVisibility }) });
      setShowNewVolume(false); setNewVolName(""); loadVolumes();

  );

function PoliciesPanel({ role }) {

function GitReposPanel({ role }) {
  const [repos, setRepos] = useState([]);
  const [showNew, setShowNew] = useState(false);
  const [form, setForm] = useState({ name: "", remote_url: "", branch: "main", pat_secret_name: "" });
  const [statusModal, setStatusModal] = useState(null);
  const [commitMsg, setCommitMsg] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const load = async () => setRepos(await api("/api/git-repos"));
  useEffect(() => { load(); }, []);

  const create = async () => {
    if (!form.name || !form.remote_url) { setErr("Name and remote URL are required"); return; }
    setBusy(true); setErr("");
    try {
      await api("/api/git-repos", { method: "POST", body: JSON.stringify(form) });
      setShowNew(false); setForm({ name: "", remote_url: "", branch: "main", pat_secret_name: "" });
      load();
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };

  const sync = async (r) => { setBusy(true); try { await api(`/api/git-repos/${r.id}/sync`, { method: "POST" }); load(); } finally { setBusy(false); } };
  const remove = async (r) => { await api(`/api/git-repos/${r.id}`, { method: "DELETE" }); load(); };
  const viewStatus = async (r) => { setStatusModal({ repo: r, status: await api(`/api/git-repos/${r.id}/status`) }); };
  const commit = async () => {
    if (!commitMsg || !statusModal) return;
    setBusy(true);
    try {
      await api(`/api/git-repos/${statusModal.repo.id}/commit`, { method: "POST", body: JSON.stringify({ message: commitMsg }) });
      setCommitMsg(""); viewStatus(statusModal.repo);
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };

  return (
    <div>
      <div className="section-label" style={{ display: "flex", justifyContent: "space-between" }}>
        <span>Git — repos cloned into the shared notebooks folder</span>
        {role !== "viewer" && <button className="new-btn" onClick={() => setShowNew(true)}>+ new</button>}
      </div>
      <p style={{ color: "var(--muted)", fontSize: 12.5, marginTop: -4 }}>
        Real <code>git</code> clone/pull/commit/push via subprocess — AtlasFlow's
        equivalent of Databricks Repos/Git folders. For private repos, reference a PAT
        stored in the Secrets tab.
      </p>
      <table className="admin-table">
        <thead><tr><th>Name</th><th>Branch</th><th>Last sync</th><th></th></tr></thead>
        <tbody>
          {repos.map(r => (
            <tr key={r.id}>
              <td>{r.name}</td>
              <td style={{ color: "var(--muted)" }}>{r.branch}</td>
              <td><span className={"badge " + (r.last_sync_status === "ok" ? "success" : r.last_sync_status === "error" ? "failed" : "pending")}>{r.last_sync_status}</span></td>
              <td style={{ whiteSpace: "nowrap" }}>
                {role !== "viewer" && <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => sync(r)} disabled={busy}>sync</button>}
                <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => viewStatus(r)}>status</button>
                {role === "admin" && <button className="btn danger" style={{ padding: "2px 8px" }} onClick={() => remove(r)}>delete</button>}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      {repos.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No repos cloned yet</div>}

      {statusModal && (
        <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && setStatusModal(null)}>
          <div className="modal" style={{ width: 480 }}>
            <h3>{statusModal.repo.name}</h3>
            {statusModal.status.cloned ? (
              <React.Fragment>
                <p style={{ fontSize: 12.5, fontFamily: "IBM Plex Mono", color: "var(--muted)" }}>{statusModal.status.last_commit}</p>
                {statusModal.status.dirty ? (
                  <React.Fragment>
                    <pre className="logs">{statusModal.status.changed_files.join("\n")}</pre>
                    {role !== "viewer" && (
                      <div className="inline-form">
                        <input placeholder="commit message" value={commitMsg} onChange={e => setCommitMsg(e.target.value)} style={{ flex: 1 }} />
                        <button className="btn primary" onClick={commit} disabled={busy}>Commit & push</button>
                      </div>
                    )}
                  </React.Fragment>
                ) : <p style={{ color: "var(--muted)", fontSize: 12.5 }}>Clean — no changes</p>}
              </React.Fragment>
            ) : <p style={{ color: "var(--muted)" }}>Not cloned</p>}
            {err && <div className="err">{err}</div>}
            <div className="row"><button className="btn" onClick={() => setStatusModal(null)}>Close</button></div>
          </div>
        </div>
      )}

      {showNew && (
        <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && setShowNew(false)}>
          <div className="modal">
            <h3>Clone a repository</h3>
            <div className="field"><label>Name (local folder)</label><input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} /></div>
            <div className="field"><label>Remote URL</label><input value={form.remote_url} onChange={e => setForm({ ...form, remote_url: e.target.value })} placeholder="https://github.com/you/repo.git" /></div>
            <div className="inline-form">
              <input placeholder="branch" value={form.branch} onChange={e => setForm({ ...form, branch: e.target.value })} />
              <input placeholder="PAT secret name (optional, for private repos)" value={form.pat_secret_name} onChange={e => setForm({ ...form, pat_secret_name: e.target.value })} />
            </div>
            {err && <div className="err">{err}</div>}
            <div className="row">
              <button className="btn" onClick={() => setShowNew(false)}>Cancel</button>
              <button className="btn primary" onClick={create} disabled={busy}>{busy ? "Cloning..." : "Clone"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function TokensPanel() {
  const [tokens, setTokens] = useState([]);
  const [availableScopes, setAvailableScopes] = useState([]);
  const [showNew, setShowNew] = useState(false);
  const [name, setName] = useState("");
  const [selectedScopes, setSelectedScopes] = useState([]);
  const [expiresInDays, setExpiresInDays] = useState("");
  const [newToken, setNewToken] = useState(null);
  const [err, setErr] = useState("");

  const load = async () => setTokens(await api("/api/auth/tokens"));
  useEffect(() => { load(); api("/api/auth/scopes").then(r => setAvailableScopes(r.scopes)); }, []);

  const toggleScope = (s) => setSelectedScopes(selectedScopes.includes(s) ? selectedScopes.filter(x => x !== s) : [...selectedScopes, s]);

  const create = async () => {
    if (!name || selectedScopes.length === 0) { setErr("Name it and pick at least one scope"); return; }
    try {
      const t = await api("/api/auth/tokens", { method: "POST", body: JSON.stringify({ name, scopes: selectedScopes, expires_in_days: expiresInDays ? parseInt(expiresInDays) : null }) });
      setNewToken(t.token);
      setShowNew(false); setName(""); setSelectedScopes([]); setExpiresInDays("");
      load();
    } catch (e) { setErr(e.message); }
  };

  const revoke = async (t) => { await api(`/api/auth/tokens/${t.id}`, { method: "DELETE" }); load(); };

  return (
    <div>
      <div className="section-label" style={{ display: "flex", justifyContent: "space-between" }}>
        <span>Access tokens — scoped tokens, restricted below your own role</span>
        <button className="new-btn" onClick={() => setShowNew(true)}>+ new</button>
      </div>
      <p style={{ color: "var(--muted)", fontSize: 12.5, marginTop: -4 }}>
        A token can only narrow what you can already do — pick specific scopes (e.g.
        "trigger workflows only") instead of full account access, for scripts/integrations
        that shouldn't have your full permissions.
      </p>
      {newToken && (
        <div className="dag-panel" style={{ marginBottom: 14 }}>
          <div style={{ color: "var(--amber)", fontSize: 12.5, marginBottom: 6 }}>Copy this now — it won't be shown again:</div>
          <pre className="logs">{newToken}</pre>
        </div>
      )}
      <table className="admin-table">
        <thead><tr><th>Name</th><th>Scopes</th><th>Expires</th><th>Last used</th><th></th></tr></thead>
        <tbody>
          {tokens.map(t => (
            <tr key={t.id}>
              <td>{t.name}</td>
              <td style={{ color: "var(--muted)" }}>{t.scopes.join(", ")}</td>
              <td style={{ color: "var(--muted)" }}>{t.expires_at ? t.expires_at.slice(0, 10) : "never"}</td>
              <td style={{ color: "var(--muted)" }}>{t.last_used_at ? t.last_used_at.slice(0, 19).replace("T", " ") : "never"}</td>
              <td><button className="btn danger" style={{ padding: "2px 8px" }} onClick={() => revoke(t)}>revoke</button></td>
            </tr>
          ))}
        </tbody>
      </table>
      {tokens.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No tokens yet</div>}

      {showNew && (
        <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && setShowNew(false)}>
          <div className="modal">
            <h3>New access token</h3>
            <div className="field"><label>Name</label><input value={name} onChange={e => setName(e.target.value)} /></div>
            <div className="section-label" style={{ marginTop: 0 }}>Scopes</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
              {availableScopes.map(s => (
                <label key={s} style={{ fontSize: 12, fontFamily: "IBM Plex Mono", color: "var(--muted)" }}>
                  <input type="checkbox" checked={selectedScopes.includes(s)} onChange={() => toggleScope(s)} /> {s}
                </label>
              ))}
            </div>
            <div className="field"><label>Expires in (days, optional — blank = never)</label><input value={expiresInDays} onChange={e => setExpiresInDays(e.target.value)} /></div>
            {err && <div className="err">{err}</div>}
            <div className="row">
              <button className="btn" onClick={() => setShowNew(false)}>Cancel</button>
              <button className="btn primary" onClick={create}>Create</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function PlaygroundPanel({ role }) {
  const [routes, setRoutes] = useState([]);
  const [routeName, setRouteName] = useState("");
  const [system, setSystem] = useState("You are a helpful assistant.");
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  useEffect(() => { api("/api/ai-gateway/routes").then(rs => { setRoutes(rs); if (rs.length) setRouteName(rs[0].name); }); }, []);

  const send = async () => {
    if (!input.trim() || !routeName) return;
    const newMessages = [...messages, { role: "user", content: input }];
    setMessages(newMessages); setInput(""); setBusy(true); setErr("");
    try {
      const res = await api("/api/ai-gateway/chat", { method: "POST", body: JSON.stringify({ route_name: routeName, messages: newMessages, system }) });
      setMessages([...newMessages, { role: "assistant", content: res.content }]);
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  return (
    <div>
      <div className="section-label">Playground — test prompts against a configured route</div>
      {routes.length === 0 && (
        <div className="empty-state" style={{ marginTop: 10 }}>No AI Gateway routes configured yet — add one in the AI Gateway tab first.</div>
      )}
      {routes.length > 0 && (
        <React.Fragment>
          <div className="inline-form">
            <select value={routeName} onChange={e => setRouteName(e.target.value)}>
              {routes.map(r => <option key={r.name} value={r.name}>{r.name} ({r.model})</option>)}
            </select>
            <input style={{ flex: 1 }} placeholder="system prompt" value={system} onChange={e => setSystem(e.target.value)} />
          </div>
          <div className="dag-panel" style={{ minHeight: 200, marginBottom: 12 }}>
            {messages.map((m, i) => (
              <div key={i} style={{ marginBottom: 10 }}>
                <div style={{ fontFamily: "IBM Plex Mono", fontSize: 11, color: m.role === "user" ? "var(--blue)" : "var(--green)", marginBottom: 2 }}>{m.role}</div>
                <div style={{ fontSize: 13, whiteSpace: "pre-wrap" }}>{m.content}</div>
              </div>
            ))}
            {messages.length === 0 && <div className="empty-state">Send a message to start</div>}
          </div>
          {err && <div className="err">{err}</div>}
          <div className="inline-form">
            <input style={{ flex: 1 }} placeholder="Type a message..." value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} disabled={role === "viewer"} />
            <button className="btn primary" onClick={send} disabled={busy || role === "viewer"}>{busy ? "..." : "Send"}</button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function PipelinesPanel({ role }) {
  const [pipelines, setPipelines] = useState([]);
  const [selected, setSelected] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [newName, setNewName] = useState("");
  const [tables, setTables] = useState([{ table_name: "", sql: "" }]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const load = async () => setPipelines(await api("/api/pipelines"));
  useEffect(() => { load(); }, []);

  const create = async () => {
    if (!newName || tables.some(t => !t.table_name || !t.sql)) { setErr("Name the pipeline and fill in every declared table"); return; }
    try {
      await api("/api/pipelines", { method: "POST", body: JSON.stringify({ name: newName, tables }) });
      setShowNew(false); setNewName(""); setTables([{ table_name: "", sql: "" }]);
      load();
    } catch (e) { setErr(e.message); }
  };

  const run = async (p) => {
    setBusy(true);
    try { setSelected(await api(`/api/pipelines/${p.id}/run`, { method: "POST" })); load(); }
    finally { setBusy(false); }
  };

  const togglePause = async (p) => { await api(`/api/pipelines/${p.id}/pause`, { method: "POST" }); load(); };
  const remove = async (p) => { await api(`/api/pipelines/${p.id}`, { method: "DELETE" }); setSelected(null); load(); };

  if (!selected) {
    return (
      <div>
        <div className="section-label" style={{ display: "flex", justifyContent: "space-between" }}>
          <span>Pipelines — declare tables, dependencies are inferred automatically</span>
          {role !== "viewer" && <button className="new-btn" onClick={() => setShowNew(true)}>+ new</button>}
        </div>
        <p style={{ color: "var(--muted)", fontSize: 12.5, marginTop: -4 }}>
          Unlike Workflows (where you wire up task dependencies by hand), a Pipeline is a
          set of declared tables — each just a name and a SELECT statement. Reference
          another declared table by name in your SQL and the execution order is inferred
          automatically. Full recompute each run, not incremental/streaming.
        </p>
        <table className="admin-table">
          <thead><tr><th>Name</th><th>Tables</th><th>Status</th><th></th></tr></thead>
          <tbody>
            {pipelines.map(p => (
              <tr key={p.id}>
                <td style={{ cursor: "pointer", color: "var(--blue)" }} onClick={() => setSelected(p)}>{p.name}{p.is_paused ? " (paused)" : ""}</td>
                <td style={{ color: "var(--muted)" }}>{p.tables.length}</td>
                <td><span className={"badge " + (p.last_run_status === "ok" ? "success" : p.last_run_status === "error" ? "failed" : "pending")}>{p.last_run_status}</span></td>
                <td style={{ whiteSpace: "nowrap" }}>
                  {role !== "viewer" && <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => run(p)} disabled={busy}>run</button>}
                  {role !== "viewer" && <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => togglePause(p)}>{p.is_paused ? "resume" : "pause"}</button>}
                  {role === "admin" && <button className="btn danger" style={{ padding: "2px 8px" }} onClick={() => remove(p)}>delete</button>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        {pipelines.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No pipelines yet</div>}

        {showNew && (
          <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && setShowNew(false)}>
            <div className="modal">
              <h3>New pipeline</h3>
              <div className="field"><label>Name</label><input value={newName} onChange={e => setNewName(e.target.value)} /></div>
              <div className="section-label" style={{ marginTop: 0 }}>Declared tables</div>
              {tables.map((t, i) => (
                <div key={i} style={{ marginBottom: 10 }}>
                  <input placeholder="table name" value={t.table_name} style={{ marginBottom: 4, width: "100%" }}
                         onChange={e => setTables(tables.map((x, xi) => xi === i ? { ...x, table_name: e.target.value } : x))} />
                  <textarea placeholder="SELECT ... FROM some_other_declared_table WHERE ..." value={t.sql} style={{ height: 70 }}
                            onChange={e => setTables(tables.map((x, xi) => xi === i ? { ...x, sql: e.target.value } : x))} />
                </div>
              ))}
              <button className="btn" onClick={() => setTables([...tables, { table_name: "", sql: "" }])}>+ add declared table</button>
              {err && <div className="err">{err}</div>}
              <div className="row">
                <button className="btn" onClick={() => setShowNew(false)}>Cancel</button>
                <button className="btn primary" onClick={create}>Create</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      <div className="breadcrumb">
        <a onClick={() => setSelected(null)}>Pipelines</a>
        <span className="sep">/</span>
        <span className="current">{selected.name}</span>
      </div>
      <div className="section-label">Declared tables — in inferred execution order</div>
      {selected.tables.map(t => (
        <div key={t.id} className={"task-row " + (t.last_status === "ok" ? "success" : t.last_status === "error" ? "failed" : "pending")}>
          <span className={"badge " + (t.last_status === "ok" ? "success" : t.last_status === "error" ? "failed" : "pending")}>{t.last_status}</span>
          <span>{t.table_name}</span>
          <span style={{ color: "var(--muted)" }}>{t.row_count != null ? `${t.row_count} rows` : ""}</span>
        </div>
      ))}
      {selected.tables.some(t => t.last_error) && (
        <pre className="logs">{selected.tables.filter(t => t.last_error).map(t => `${t.table_name}: ${t.last_error}`).join("\n\n")}</pre>
      )}
    </div>
  );
}

function SharingPanel({ role }) {
  const [shares, setShares] = useState([]);
  const [selected, setSelected] = useState(null);
  const [tables, setTables] = useState([]);
  const [recipients, setRecipients] = useState([]);
  const [showNew, setShowNew] = useState(false);
  const [newName, setNewName] = useState("");
  const [addTableName, setAddTableName] = useState("");
  const [newRecipientName, setNewRecipientName] = useState("");
  const [profileModal, setProfileModal] = useState(null);
  const [err, setErr] = useState("");

  const load = async () => setShares(await api("/api/sharing/shares"));
  useEffect(() => { load(); }, []);

  const open = async (s) => {
    setSelected(s);
    setTables(await api(`/api/sharing/shares/${s.id}/tables`));
    setRecipients(await api(`/api/sharing/shares/${s.id}/recipients`));
  };

  const createShare = async () => {
    if (!newName) return;
    try {
      await api("/api/sharing/shares", { method: "POST", body: JSON.stringify({ name: newName }) });
      setShowNew(false); setNewName(""); load();
    } catch (e) { setErr(e.message); }
  };

  const addTable = async () => {
    if (!addTableName) return;
    try {
      await api(`/api/sharing/shares/${selected.id}/tables`, { method: "POST", body: JSON.stringify({ table_name: addTableName }) });
      setAddTableName(""); open(selected);
    } catch (e) { setErr(e.message); }
  };

  const removeTable = async (id) => { await api(`/api/sharing/shares/tables/${id}`, { method: "DELETE" }); open(selected); };

  const addRecipient = async () => {
    if (!newRecipientName) return;
    const r = await api(`/api/sharing/shares/${selected.id}/recipients`, { method: "POST", body: JSON.stringify({ name: newRecipientName }) });
    setNewRecipientName(""); open(selected);
    const profile = { shareCredentialsVersion: 1, endpoint: `${API_BASE}/delta-sharing`, bearerToken: r.bearer_token };
    setProfileModal({ name: r.name, profile });
  };

  const showProfile = async (r) => {
    const profile = await api(`/api/sharing/shares/${selected.id}/recipients/${r.id}/profile`, { method: "GET" });
    setProfileModal({ name: r.name, profile });
  };

  const removeRecipient = async (id) => { await api(`/api/sharing/shares/recipients/${id}`, { method: "DELETE" }); open(selected); };

  if (!selected) {
    return (
      <div>
        <div className="section-label" style={{ display: "flex", justifyContent: "space-between" }}>
          <span>Sharing — real Delta Sharing protocol, readable by any standard client</span>
          {role !== "viewer" && <button className="new-btn" onClick={() => setShowNew(true)}>+ new share</button>}
        </div>
        <p style={{ color: "var(--muted)", fontSize: 12.5, marginTop: -4 }}>
          Implements the real, open Delta Sharing REST protocol — recipients can read
          shared tables with the standard <code>delta-sharing</code> Python/Spark library
          or Power BI's Delta Sharing connector, not just AtlasFlow itself.
        </p>
        <table className="admin-table">
          <thead><tr><th>Name</th><th>Tables</th><th>Recipients</th></tr></thead>
          <tbody>
            {shares.map(s => (
              <tr key={s.id} style={{ cursor: "pointer" }} onClick={() => open(s)}>
                <td style={{ color: "var(--blue)" }}>{s.name}</td>
                <td style={{ color: "var(--muted)" }}>{s.table_count}</td>
                <td style={{ color: "var(--muted)" }}>{s.recipient_count}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {shares.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No shares yet</div>}

        {showNew && (
          <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && setShowNew(false)}>
            <div className="modal" style={{ width: 340 }}>
              <h3>New share</h3>
              <input value={newName} onChange={e => setNewName(e.target.value)} autoFocus />
              {err && <div className="err">{err}</div>}
              <div className="row">
                <button className="btn" onClick={() => setShowNew(false)}>Cancel</button>
                <button className="btn primary" onClick={createShare}>Create</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      <div className="breadcrumb">
        <a onClick={() => setSelected(null)}>Sharing</a>
        <span className="sep">/</span>
        <span className="current">{selected.name}</span>
      </div>

      <div className="section-label">Tables in this share</div>
      {role !== "viewer" && (
        <div className="inline-form">
          <input placeholder="catalog table name" value={addTableName} onChange={e => setAddTableName(e.target.value)} />
          <button className="btn primary" onClick={addTable}>Add table</button>
        </div>
      )}
      {err && <div className="err">{err}</div>}
      <table className="admin-table">
        <thead><tr><th>Shared as</th><th></th></tr></thead>
        <tbody>
          {tables.map(t => (
            <tr key={t.id}><td>{t.shared_name}</td><td>{role !== "viewer" && <button className="btn danger" style={{ padding: "2px 8px" }} onClick={() => removeTable(t.id)}>remove</button>}</td></tr>
          ))}
        </tbody>
      </table>
      {tables.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No tables added yet</div>}

      <div className="section-label" style={{ marginTop: 20 }}>Recipients</div>
      {role !== "viewer" && (
        <div className="inline-form">
          <input placeholder="recipient name" value={newRecipientName} onChange={e => setNewRecipientName(e.target.value)} />
          <button className="btn primary" onClick={addRecipient}>Add recipient</button>
        </div>
      )}
      <table className="admin-table">
        <thead><tr><th>Name</th><th></th></tr></thead>
        <tbody>
          {recipients.map(r => (
            <tr key={r.id}>
              <td>{r.name}</td>
              <td style={{ whiteSpace: "nowrap" }}>
                <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => showProfile(r)}>get profile</button>
                {role !== "viewer" && <button className="btn danger" style={{ padding: "2px 8px" }} onClick={() => removeRecipient(r.id)}>remove</button>}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      {recipients.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No recipients yet</div>}

      {profileModal && (
        <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && setProfileModal(null)}>
          <div className="modal" style={{ width: 480 }}>
            <h3>Profile for "{profileModal.name}"</h3>
            <p style={{ color: "var(--muted)", fontSize: 12.5, marginTop: -6 }}>
              Save this as a <code>.share</code> file and hand it to the recipient. They use it with:
            </p>
            <pre className="logs">{`import delta_sharing\nclient = delta_sharing.SharingClient("config.share")\ndf = delta_sharing.load_as_pandas("config.share#${selected.name}.default.TABLE_NAME")`}</pre>
            <p style={{ color: "var(--muted)", fontSize: 12.5 }}>Profile file contents (regenerating invalidates the previous token):</p>
            <pre className="logs">{JSON.stringify(profileModal.profile, null, 2)}</pre>
            <div className="row"><button className="btn" onClick={() => setProfileModal(null)}>Close</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

function LakebasePanel({ role }) {
  const [tables, setTables] = useState([]);
  const [selected, setSelected] = useState(null);
  const [rows, setRows] = useState([]);
  const [showNew, setShowNew] = useState(false);
  const [newName, setNewName] = useState("");
  const [columns, setColumns] = useState([{ name: "", type: "text" }]);
  const [newRow, setNewRow] = useState({});
  const [err, setErr] = useState("");

  const load = async () => setTables(await api("/api/lakebase/tables"));
  useEffect(() => { load(); }, []);

  const openTable = async (t) => {
    setSelected(t); setNewRow({});
    setRows(await api(`/api/lakebase/tables/${t.id}/rows`));
  };

  const createTable = async () => {
    if (!newName || columns.some(c => !c.name)) { setErr("Name the table and every column"); return; }
    try {
      await api("/api/lakebase/tables", { method: "POST", body: JSON.stringify({ name: newName, columns, description: "" }) });
      setShowNew(false); setNewName(""); setColumns([{ name: "", type: "text" }]);
      load();
    } catch (e) { setErr(e.message); }
  };

  const insertRow = async () => {
    try {
      await api(`/api/lakebase/tables/${selected.id}/rows`, { method: "POST", body: JSON.stringify({ values: newRow }) });
      setNewRow({});
      openTable(selected);
    } catch (e) { setErr(e.message); }
  };

  const deleteRow = async (id) => { await api(`/api/lakebase/tables/${selected.id}/rows/${id}`, { method: "DELETE" }); openTable(selected); };
  const deleteTable = async (t) => { await api(`/api/lakebase/tables/${t.id}`, { method: "DELETE" }); setSelected(null); load(); };
  const sync = async (t) => { await api(`/api/lakebase/tables/${t.id}/sync`, { method: "POST" }); load(); };

  if (!selected) {
    return (
      <div>
        <div className="section-label" style={{ display: "flex", justifyContent: "space-between" }}>
          <span>Lakebase — real transactional (OLTP) tables</span>
          {role !== "viewer" && <button className="new-btn" onClick={() => setShowNew(true)}>+ new</button>}
        </div>
        <p style={{ color: "var(--muted)", fontSize: 12.5, marginTop: -4 }}>
          Real Postgres-backed tables with row-level insert/update/delete — different from
          the Data tab's Delta tables (batch/analytical, not row-editable). "Sync to Delta"
          does a periodic full-refresh read into an analytics-ready table; it's not
          real-time change-data-capture streaming.
        </p>
        <table className="admin-table">
          <thead><tr><th>Name</th><th>Rows</th><th>Synced to</th><th></th></tr></thead>
          <tbody>
            {tables.map(t => (
              <tr key={t.id}>
                <td style={{ cursor: "pointer", color: "var(--blue)" }} onClick={() => openTable(t)}>{t.name}</td>
                <td style={{ color: "var(--muted)" }}>{t.row_count}</td>
                <td style={{ color: "var(--muted)" }}>{t.synced_table_name || "—"}</td>
                <td>
                  {role !== "viewer" && <button className="btn" style={{ padding: "2px 8px", marginRight: 4 }} onClick={() => sync(t)}>sync to Delta</button>}
                  {role === "admin" && <button className="btn danger" style={{ padding: "2px 8px" }} onClick={() => deleteTable(t)}>delete</button>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        {tables.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No Lakebase tables yet</div>}

        {showNew && (
          <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && setShowNew(false)}>
            <div className="modal">
              <h3>New Lakebase table</h3>
              <div className="field"><label>Name</label><input value={newName} onChange={e => setNewName(e.target.value)} /></div>
              <div className="section-label" style={{ marginTop: 0 }}>Columns (an "id" primary key is added automatically)</div>
              {columns.map((c, i) => (
                <div key={i} className="inline-form" style={{ marginBottom: 6 }}>
                  <input placeholder="column name" value={c.name} onChange={e => setColumns(columns.map((x, xi) => xi === i ? { ...x, name: e.target.value } : x))} />
                  <select value={c.type} onChange={e => setColumns(columns.map((x, xi) => xi === i ? { ...x, type: e.target.value } : x))}>
                    <option value="text">text</option><option value="integer">integer</option><option value="bigint">bigint</option>
                    <option value="boolean">boolean</option><option value="double precision">double</option>
                    <option value="timestamp">timestamp</option><option value="date">date</option><option value="numeric">numeric</option>
                  </select>
                </div>
              ))}
              <button className="btn" onClick={() => setColumns([...columns, { name: "", type: "text" }])}>+ add column</button>
              {err && <div className="err">{err}</div>}
              <div className="row">
                <button className="btn" onClick={() => setShowNew(false)}>Cancel</button>
                <button className="btn primary" onClick={createTable}>Create</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      <div className="breadcrumb">
        <a onClick={() => setSelected(null)}>Lakebase</a>
        <span className="sep">/</span>
        <span className="current">{selected.name}</span>
      </div>
      {role !== "viewer" && (
        <div className="inline-form">
          {selected.columns.map(c => (
            <input key={c.name} placeholder={`${c.name} (${c.type})`} value={newRow[c.name] || ""}
                   onChange={e => setNewRow({ ...newRow, [c.name]: e.target.value })} />
          ))}
          <button className="btn primary" onClick={insertRow}>Insert row</button>
        </div>
      )}
      {err && <div className="err">{err}</div>}
      <table className="admin-table">
        <thead><tr><th>id</th>{selected.columns.map(c => <th key={c.name}>{c.name}</th>)}<th></th></tr></thead>
        <tbody>
          {rows.map(r => (
            <tr key={r.id}>
              <td>{r.id}</td>
              {selected.columns.map(c => <td key={c.name}>{String(r[c.name] ?? "")}</td>)}
              <td>{role !== "viewer" && <button className="btn danger" style={{ padding: "2px 8px" }} onClick={() => deleteRow(r.id)}>delete</button>}</td>
            </tr>
          ))}
        </tbody>
      </table>
      {rows.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No rows yet</div>}
    </div>
  );
}

function IngestionPanel({ role }) {
  const [sources, setSources] = useState([]);
  const [step, setStep] = useState(1);  // 1: pick type, 2: connect, 3: preview + name
  const [sourceType, setSourceType] = useState("postgres");
  const [form, setForm] = useState({ name: "", host: "", port: "5432", database: "", username: "", password: "", url: "", method: "GET", auth_token: "", response_path: "" });
  const [query, setQuery] = useState("");
  const [savedSourceId, setSavedSourceId] = useState(null);
  const [preview, setPreview] = useState(null);
  const [tableName, setTableName] = useState("");
  const [visibility, setVisibility] = useState("public");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [result, setResult] = useState(null);

  const loadSources = async () => setSources(await api("/api/ingestion/sources"));
  useEffect(() => { loadSources(); }, []);

  const reset = () => {
    setStep(1); setForm({ name: "", host: "", port: "5432", database: "", username: "", password: "", url: "", method: "GET", auth_token: "", response_path: "" });
    setQuery(""); setSavedSourceId(null); setPreview(null); setTableName(""); setResult(null); setErr("");
  };

  const saveSource = async () => {
    setErr("");
    try {
      const payload = { name: form.name, source_type: sourceType, ...form };
      const s = await api("/api/ingestion/sources", { method: "POST", body: JSON.stringify(payload) });
      setSavedSourceId(s.id);
      setStep(3);
    } catch (e) { setErr(e.message); }
  };

  const runPreview = async () => {
    setBusy(true); setErr(""); setPreview(null);
    try { setPreview(await api(`/api/ingestion/sources/${savedSourceId}/preview`, { method: "POST", body: JSON.stringify({ query }) })); }
    catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  const runIngest = async () => {
    if (!tableName) { setErr("Name the table first"); return; }
    setBusy(true); setErr("");
    try {
      const table = await api(`/api/ingestion/sources/${savedSourceId}/ingest`, { method: "POST", body: JSON.stringify({ query, table_name: tableName, visibility }) });
      setResult(table);
      loadSources();
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  return (
    <div>
      <div className="section-label" style={{ display: "flex", justifyContent: "space-between" }}>
        <span>Data Ingestion — connect a database or API, land it as a table</span>
        <button className="new-btn" onClick={reset}>+ new ingestion</button>
      </div>
      <p style={{ color: "var(--muted)", fontSize: 12.5, marginTop: -4 }}>

        directly and land as a Delta table the same way file uploads do.
      </p>

      <table className="admin-table">
        <thead><tr><th>Saved source</th><th>Type</th></tr></thead>
        <tbody>
          {sources.map(s => (
            <tr key={s.id}><td>{s.name}</td><td style={{ color: "var(--muted)" }}>{s.source_type}</td></tr>

        </tbody>
      </table>
      {sources.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No sources connected yet</div>}

      {step > 0 && role !== "viewer" && (
        <div className="dag-panel" style={{ marginTop: 18 }}>
          {step === 1 && (
            <React.Fragment>
              <div className="section-label" style={{ marginTop: 0 }}>1. Pick a source</div>
              <div className="inline-form">
                <select value={sourceType} onChange={e => setSourceType(e.target.value)}>
                  <option value="postgres">PostgreSQL</option>
                  <option value="mysql">MySQL</option>
                  <option value="rest_api">REST API</option>
                </select>
                <button className="btn primary" onClick={() => setStep(2)}>Next</button>
              </div>
            </React.Fragment>
          )}

          {step === 2 && (
            <React.Fragment>
              <div className="section-label" style={{ marginTop: 0 }}>2. Connect</div>
              <div className="field"><label>Connection name</label><input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} /></div>
              {(sourceType === "postgres" || sourceType === "mysql") && (
                <React.Fragment>
                  <div className="inline-form">
                    <input placeholder="host" value={form.host} onChange={e => setForm({ ...form, host: e.target.value })} />
                    <input placeholder="port" value={form.port} onChange={e => setForm({ ...form, port: e.target.value })} style={{ width: 80 }} />
                    <input placeholder="database" value={form.database} onChange={e => setForm({ ...form, database: e.target.value })} />
                  </div>
                  <div className="inline-form">
                    <input placeholder="username" value={form.username} onChange={e => setForm({ ...form, username: e.target.value })} />
                    <input placeholder="password" type="password" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} />
                  </div>
                </React.Fragment>
              )}
              {sourceType === "rest_api" && (
                <React.Fragment>
                  <div className="field"><label>URL</label><input value={form.url} onChange={e => setForm({ ...form, url: e.target.value })} placeholder="https://api.example.com/orders" /></div>
                  <div className="inline-form">
                    <input placeholder="auth token (optional, sent as Bearer)" value={form.auth_token} onChange={e => setForm({ ...form, auth_token: e.target.value })} />
                    <input placeholder="response path (e.g. data.records)" value={form.response_path} onChange={e => setForm({ ...form, response_path: e.target.value })} />
                  </div>
                </React.Fragment>
              )}
              {err && <div className="err">{err}</div>}
              <div className="row">
                <button className="btn" onClick={() => setStep(1)}>Back</button>
                <button className="btn primary" onClick={saveSource}>Save & continue</button>
              </div>
            </React.Fragment>
          )}

          {step === 3 && (
            <React.Fragment>
              <div className="section-label" style={{ marginTop: 0 }}>3. Preview & land as a table</div>
              {(sourceType === "postgres" || sourceType === "mysql") && (
                <div className="field">
                  <label>Table name or subquery</label>
                  <input value={query} onChange={e => setQuery(e.target.value)} placeholder="orders, or (SELECT * FROM orders WHERE ...) t" />
                </div>
              )}
              <button className="btn" onClick={runPreview} disabled={busy}>{busy ? "Loading..." : "Preview"}</button>
              {preview && (
                <div style={{ marginTop: 12, overflowX: "auto" }}>
                  <table className="admin-table">
                    <thead><tr>{preview.columns.map(c => <th key={c}>{c}</th>)}</tr></thead>
                    <tbody>
                      {preview.rows.slice(0, 10).map((row, i) => (
                        <tr key={i}>{preview.columns.map(c => <td key={c}>{String(row[c])}</td>)}</tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
              <div className="inline-form" style={{ marginTop: 14 }}>
                <input placeholder="table name" value={tableName} onChange={e => setTableName(e.target.value)} />
                <select value={visibility} onChange={e => setVisibility(e.target.value)}>
                  <option value="public">Public</option>
                  <option value="restricted">Restricted</option>
                </select>
                <button className="btn primary" onClick={runIngest} disabled={busy}>{busy ? "Ingesting..." : "Ingest"}</button>
              </div>
              {err && <div className="err">{err}</div>}
              {result && <div style={{ color: "var(--green)", fontSize: 12.5, marginTop: 10, fontFamily: "IBM Plex Mono" }}>Created table "{result.name}" ({result.row_count} rows) — find it in the Data tab.</div>}
            </React.Fragment>
          )}
        </div>
      )}
    </div>
  );
}

function NotebooksPanel({ role }) {
  const [notebooks, setNotebooks] = useState([]);
  const [scheduling, setScheduling] = useState(null);
  const [params, setParams] = useState([{ key: "", value: "" }]);
  const [cron, setCron] = useState("");
  const [err, setErr] = useState("");
  const [created, setCreated] = useState(null);

  const load = async () => setNotebooks(await api("/api/notebooks"));
  useEffect(() => { load(); }, []);

  const submit = async () => {
    setErr(""); setCreated(null);
    const paramObj = {};
    params.forEach(p => { if (p.key) paramObj[p.key] = p.value; });
    try {
      const wf = await api("/api/notebooks/quick-schedule", {
        method: "POST",
        body: JSON.stringify({ notebook_path: scheduling.path, params: paramObj, schedule_cron: cron || null }),
      });
      setCreated(wf);
      setScheduling(null); setParams([{ key: "", value: "" }]); setCron("");
    } catch (e) { setErr(e.message); }
  };

  return (
    <div>
      <div className="section-label">Notebooks — run parameters + quick scheduling</div>
      <p style={{ color: "var(--muted)", fontSize: 12.5, marginTop: -4 }}>
        Lists <code>.ipynb</code> files from the shared notebooks folder. Edit them at{" "}
        <a href="http://localhost:8888" target="_blank" rel="noopener noreferrer" style={{ color: "var(--blue)" }}>localhost:8888</a>{" "}
        (Jupyter Lab); use "Quick schedule" here to set parameters and turn one into a
        scheduled (or one-off) workflow without hand-building a DAG for it. This isn't the
        same as Databricks' live in-notebook widgets — parameters are set here, before the
        notebook runs, not edited reactively inside it.
      </p>
      {created && (
        <div style={{ color: "var(--green)", fontSize: 12.5, fontFamily: "IBM Plex Mono", marginBottom: 10 }}>
          Created workflow "{created.name}" — find it in the Workflows tab to trigger or view runs.
        </div>
      )}
      <table className="admin-table">
        <thead><tr><th>Name</th><th>Path</th><th></th></tr></thead>
        <tbody>
          {notebooks.map(n => (
            <tr key={n.path}>
              <td>{n.name}</td>
              <td style={{ color: "var(--muted)" }}>{n.path}</td>
              <td>{role !== "viewer" && <button className="btn" style={{ padding: "2px 8px" }} onClick={() => setScheduling(n)}>Quick schedule</button>}</td>
            </tr>
          ))}
        </tbody>
      </table>
      {notebooks.length === 0 && <div className="empty-state" style={{ marginTop: 10 }}>No notebooks found in ./notebooks</div>}

      {scheduling && (
        <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && setScheduling(null)}>
          <div className="modal">
            <h3>Quick schedule — {scheduling.name}</h3>
            <div className="section-label" style={{ marginTop: 0 }}>Parameters (papermill)</div>
            {params.map((p, i) => (
              <div key={i} className="inline-form" style={{ marginBottom: 6 }}>
                <input placeholder="key" value={p.key} onChange={e => setParams(params.map((x, xi) => xi === i ? { ...x, key: e.target.value } : x))} />
                <input placeholder="value" value={p.value} onChange={e => setParams(params.map((x, xi) => xi === i ? { ...x, value: e.target.value } : x))} />
              </div>
            ))}
            <button className="btn" onClick={() => setParams([...params, { key: "", value: "" }])}>+ add parameter</button>
            <div className="field" style={{ marginTop: 12 }}>
              <label>Schedule (cron, optional — leave blank to run manually via the Workflows tab)</label>
              <input value={cron} onChange={e => setCron(e.target.value)} placeholder="0 6 * * *" />
            </div>
            {err && <div className="err">{err}</div>}
            <div className="row">
              <button className="btn" onClick={() => setScheduling(null)}>Cancel</button>
              <button className="btn primary" onClick={submit}>Create workflow</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function RunComments({ runId }) {

  const load = async () => setComments(await api(`/api/runs/${runId}/comments`));
  useEffect(() => { load(); }, [runId]);

  const post = async () => {
    if (!text.trim()) return;
    await api(`/api/runs/${runId}/comments`, { method: "POST", body: JSON.stringify({ text }) });
    setText(""); load();
  };

  return (
    <div style={{ marginTop: 18 }}>
      <div className="section-label">Comments</div>
      {comments.map(c => (
        <div key={c.id} style={{ marginBottom: 8, fontSize: 12.5 }}>
          <span style={{ fontFamily: "IBM Plex Mono", color: "var(--blue)" }}>{c.username || "unknown"}</span>
          <span style={{ color: "var(--muted)", fontFamily: "IBM Plex Mono", fontSize: 11, marginLeft: 8 }}>{c.created_at.slice(0, 19).replace("T", " ")}</span>

        </div>
